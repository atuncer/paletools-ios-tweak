name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs (artifacts only, no release)

permissions:
  contents: write # required to create/upload to Releases

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools (ldid for signing, dpkg for packaging)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          # Drop pre-installed untrusted taps so brew doesn't warn about them.
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install ldid dpkg

      - name: Set up Node (used by build-inject.sh)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Theos
        uses: actions/cache@v6
        with:
          path: ~/theos
          # Bump the suffix to force a fresh Theos clone.
          key: theos-${{ runner.os }}-v1

      - name: Set up Theos
        run: |
          if [ ! -d "$HOME/theos/makefiles" ]; then
            git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          else
            echo "Theos restored from cache."
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # Resolve PALETOOLS_VERSION (usually `latest`) to a concrete version ONCE,
      # so the stamped metadata can't drift from the bundle that gets embedded.
      - name: Resolve PaleTools version
        id: paletools
        run: |
          PIN=$(sed -n 's/^PALETOOLS_VERSION[[:space:]]*=[[:space:]]*//p' Makefile | head -1)
          VERSION=$(node fetch-mobile-prod.mjs --resolve "$PIN")
          if [ -z "$VERSION" ]; then echo "could not resolve '$PIN'" >&2; exit 1; fi
          echo "PALETOOLS_VERSION '$PIN' -> '$VERSION'"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The .deb takes its filename and package version from `control`, so stamp
      # the resolved version in before packaging. perl -i avoids the BSD/GNU sed
      # -i difference on the macOS runner.
      - name: Stamp resolved version into control
        run: |
          perl -pi -e 's/^Version:.*/Version: ${{ steps.paletools.outputs.version }}/' control
          grep '^Version:' control

      # Pass the resolved version explicitly: the build must not re-resolve
      # `latest` and risk embedding a different bundle than we just stamped.
      - name: Build (.deb + standalone .dylib)
        run: make package FINALPACKAGE=1 PALETOOLS_VERSION=${{ steps.paletools.outputs.version }}

      - name: Show outputs
        run: |
          ls -la packages/
          echo "### PaleTools ${{ steps.paletools.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          ls packages/ >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: paletools-binaries-${{ steps.paletools.outputs.version }}
          path: |
            packages/*.deb
            packages/PaleTools.dylib
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PaleTools ${{ steps.paletools.outputs.version }}
          files: |
            packages/*.deb
            packages/PaleTools.dylib
          fail_on_unmatched_files: true
          generate_release_notes: true
